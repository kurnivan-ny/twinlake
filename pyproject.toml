[project]
name = "twinlake"
version = "0.1.0"
description = "One codebase for on-prem dev (Sail, RustFS) and Databricks prod"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
# Spark client; Databricks provides its own session in prod.
spark = ["pyspark[connect]>=3.5"]
dev = [
    # exact pins: quality tests verified on Sail with these (2026-10-28)
    "pyspark[connect]==4.2.1",
    "pysail==0.7.2",
    "jedi>=0.19.2,<0.20",  # needed by pysail's compatibility_check
    "pytest>=8",
    "ruff",
    "sqlfluff",
    "pre-commit",
]

[tool.setuptools.packages.find]
include = ["twinlake*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
