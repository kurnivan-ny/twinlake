/text><text x="634" y="124" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">main is protected</text></g><g><rect x="556" y="202" width="156" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="634" y="226" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Deploy to prod</text><text x="634" y="244" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">bundle deploy -t prod</text></g><text x="538" y="102" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">yes</text><text x="466" y="182" font-size="11.5" fill="var(--cds-text-secondary)">no</text><text x="644" y="174" font-size="11.5" fill="var(--cds-text-secondary)">GitHub Actions</text><text x="279" y="222" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">fix and push</text></svg>
